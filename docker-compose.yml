# Laboratorio: Pruebas de una arquitectura con API Gateway — Grupo 4
# Levantar:  docker compose up -d --build
services:
  gateway:
    image: kong:3.9
    container_name: gateway
    environment:
      KONG_DATABASE: "off"                              # modo DB-less
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"   # ÚNICO punto de entrada para los clientes
      - "8001:8001"   # API de administración (solo para inspección)
    depends_on: [productos, pedidos]

  productos:
    build: ./servicios/productos
    container_name: productos
    environment:
      PUERTO: 3001
    # Sin "ports": el servicio NO se expone al exterior, solo se alcanza vía gateway

  pedidos:
    build: ./servicios/pedidos
    container_name: pedidos
    environment:
      PUERTO: 3002
      URL_PRODUCTOS: http://productos:3001
